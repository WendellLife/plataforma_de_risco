services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risco
      POSTGRES_USER: risco
      POSTGRES_PASSWORD: risco
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risco"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes: [.:/app]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -Q documentos,lotes,sincronizacao,midia -l info
    env_file: .env
    volumes: [.:/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
