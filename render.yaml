# Blueprint gratuito do Render para demonstração — cria banco, Redis e web.
# No Render: New › Blueprint › aponte para este repositório.

databases:
  - name: risco-db
    databaseName: risco
    user: risco
    plan: free
    postgresMajorVersion: "16"

services:
  - type: redis
    name: risco-redis
    plan: free
    maxmemoryPolicy: noeviction   # fila Celery não pode perder tarefa
    ipAllowList: []

  - type: web
    name: risco-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase: {name: risco-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: risco-redis, type: redis, property: connectionString}
      - key: SIGNING_MODE
        value: simple
      - key: WEB_CONCURRENCY
        value: "3"
      # O plano gratuito não oferece worker. As tarefas rodam no processo web.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
