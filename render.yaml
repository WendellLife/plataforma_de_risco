# Blueprint do Render — cria banco, Redis, web e worker em um passo.
# No Render: New › Blueprint › aponte para este repositório.

databases:
  - name: risco-db
    databaseName: risco
    user: risco
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: redis
    name: risco-redis
    plan: starter
    maxmemoryPolicy: noeviction   # fila Celery não pode perder tarefa
    ipAllowList: []

  - type: web
    name: risco-web
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase: {name: risco-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: risco-redis, type: redis, property: connectionString}
      - key: SIGNING_MODE
        value: simple
      - key: WEB_CONCURRENCY
        value: "3"
      # Sprint 7 — artefato publicado em bucket. Disco do Render é efêmero: sem estas
      # variáveis o PDF de uma versão publicada se perde no próximo deploy.
      - key: DOCUMENTS_BUCKET
        sync: false
      - key: DOCUMENTS_BUCKET_REGION
        value: us-east-1
      - key: DOCUMENTS_BUCKET_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: risco-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -Q documentos,lotes,sincronizacao,planos,midia -l info --concurrency 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SECRET_KEY
        fromService: {name: risco-web, type: web, envVarKey: SECRET_KEY}
      - key: DATABASE_URL
        fromDatabase: {name: risco-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: risco-redis, type: redis, property: connectionString}
      # O worker compõe e GRAVA o PDF: precisa das mesmas credenciais de bucket que o web.
      - key: DOCUMENTS_BUCKET
        fromService: {name: risco-web, type: web, envVarKey: DOCUMENTS_BUCKET}
      - key: DOCUMENTS_BUCKET_REGION
        fromService: {name: risco-web, type: web, envVarKey: DOCUMENTS_BUCKET_REGION}
      - key: DOCUMENTS_BUCKET_ENDPOINT
        fromService: {name: risco-web, type: web, envVarKey: DOCUMENTS_BUCKET_ENDPOINT}
      - key: AWS_ACCESS_KEY_ID
        fromService: {name: risco-web, type: web, envVarKey: AWS_ACCESS_KEY_ID}
      - key: AWS_SECRET_ACCESS_KEY
        fromService: {name: risco-web, type: web, envVarKey: AWS_SECRET_ACCESS_KEY}

