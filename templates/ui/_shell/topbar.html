<header class="topbar">
  <nav class="crumbs">{% block crumbs %}{% endblock %}</nav>
  <form class="crumbs" style="margin-left:auto" action="{% url 'maquinas' %}" method="get">
    <input class="field" type="search" name="q" placeholder="Buscar máquina ou série" style="min-width:240px">
  </form>
  {% if shell.usuario %}
  <span style="font:600 12.5px/1 var(--font-body);color:var(--text-muted)">{{ shell.usuario.get_full_name|default:shell.usuario.email }}</span>
  {% endif %}
</header>
